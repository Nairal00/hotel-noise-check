[project]
name = "hotel-noise-check"
version = "0.1.0"
description = "Check whether hotels suit noise-sensitive guests, using Claude Agent SDK subagents"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
    "pandas",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pylint",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hotel_checker_agent*"]
